services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetcore_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-fleetcore}
    ports:
      - "5433:5432"
    volumes:
      - fleetcore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-fleetcore}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    container_name: fleetcore_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-fleetcore}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      API_KEYS: ${API_KEYS:-demo-key-partner-1,demo-key-partner-2}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fleetcore_postgres_data:
